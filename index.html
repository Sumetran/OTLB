<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกเวลาเลิกงาน OT - ศูนย์ลพบุรี</title>
    <!-- Google Font: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f4ef;
            --card-bg: #ffffff;
            --primary: #8d7b68;
            --primary-hover: #756554;
            --accent: #c4b5a5;
            --text-main: #4a4238;
            --text-muted: #8c8275;
            --input-bg: #faf8f5;
            --border-color: #e3ded5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            padding: 20px 16px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(141, 123, 104, 0.08);
            margin-bottom: 16px;
            border: 1px solid rgba(227, 222, 213, 0.6);
            width: 100%;
        }

        h2 {
            text-align: center;
            color: var(--text-main);
            font-weight: 600;
            font-size: 19px;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        h3 {
            color: var(--text-main);
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-main);
            font-weight: 500;
            font-size: 13.5px;
        }

        input, select {
            width: 100%;
            height: 46px;
            padding: 10px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Prompt', sans-serif;
            color: var(--text-main);
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(141, 123, 104, 0.12);
        }

        .camera-box {
            background: var(--input-bg);
            border: 1.5px dashed var(--border-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .btn-group-cam {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn-camera {
            flex: 1;
            background-color: var(--accent);
            color: var(--text-main);
            border: none;
            height: 42px;
            padding: 0 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-camera:active {
            background-color: var(--primary);
            color: white;
        }

        video, canvas, img.preview {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        button.submit-btn {
            width: 100%;
            height: 48px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Prompt', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(141, 123, 104, 0.2);
        }

        button.submit-btn:active {
            background-color: var(--primary-hover);
        }

        #status {
            text-align: center;
            margin-top: 12px;
            font-weight: 500;
            font-size: 13.5px;
        }

        /* ประวัติการบันทึก - สไตล์การ์ดบนมือถือ */
        .history-card {
            background: var(--card-bg);
            padding: 18px 14px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(141, 123, 104, 0.08);
            border: 1px solid rgba(227, 222, 213, 0.6);
            width: 100%;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .history-item {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 4px;
        }

        .history-date {
            font-weight: 600;
            color: var(--text-main);
        }

        .history-time {
            font-weight: 700;
            color: var(--primary);
            font-size: 15px;
            background: #ffffff;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .history-body {
            display: flex;
            justify-content: space-between;
            color: var(--text-main);
        }

        .history-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .history-link {
            color: var(--primary);
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>⏱️ บันทึกเวลาเลิกงาน OT<br><span style="font-size:14px; font-weight:400; color:var(--text-muted);">(ศูนย์ลพบุรี)</span></h2>
        <form id="otForm">
            <!-- วันที่เลิกดึก -->
            <div class="form-group">
                <label for="workDate">วันที่เลิกดึก</label>
                <input type="date" id="workDate" lang="en-GB" required>
            </div>

            <!-- ชื่อ-นามสกุล -->
            <div class="form-group">
                <label for="fullName">ชื่อ-นามสกุล</label>
                <input type="text" id="fullName" placeholder="ไม่ต้องมีคำนำหน้า เช่น สมชาย ใจดี" required>
            </div>

            <!-- ทีม -->
            <div class="form-group">
                <label for="team">ทีม</label>
                <select id="team" required>
                    <option value="">-- เลือกทีมของคุณ --</option>
                    <option value="CM นอกเมืองลพบุรี">CM นอกเมืองลพบุรี</option>
                    <option value="CM ในเมืองลพบุรี">CM ในเมืองลพบุรี</option>
                    <option value="CM สิงห์บุรี">CM สิงห์บุรี</option>
                    <option value="CM อ่างทอง">CM อ่างทอง</option>
                    <option value="CM สระบุรี">CM สระบุรี</option>
                    <option value="PM ทีมพี่ฟลุ๊ค">PM ทีมพี่ฟลุ๊ค</option>
                    <option value="PM ทีมพี่เป้า">PM ทีมพี่เป้า</option>
                    <option value="PM ทีมพี่บัญชา">PM ทีมพี่บัญชา</option>
                    <option value="ลูกค้านอก">ลูกค้านอก</option>
                    <option value="กาแฟ">กาแฟ</option>
                    <option value="อื่นๆ">อื่นๆ</option>
                </select>
            </div>

            <!-- ถ่ายรูป Timestamp -->
            <div class="form-group">
                <label>รูปถ่ายเซลฟี่ Time Stamp หน้าสาขา</label>
                <div class="camera-box">
                    <div class="btn-group-cam">
                        <button type="button" class="btn-camera" id="startCamBtn">📷 กล้องสด</button>
                        <input type="file" id="uploadFile" accept="image/*" style="display: none;">
                        <button type="button" class="btn-camera" onclick="document.getElementById('uploadFile').click()">📁 อัปโหลดรูป</button>
                    </div>
                    
                    <video id="video" autoplay playsinline></video>
                    <button type="button" class="btn-camera" id="captureBtn" style="display:none; background-color: var(--primary); color:white; width:100%; margin-top:10px; height:40px;">📸 กดถ่ายภาพตอนนี้</button>
                    
                    <canvas id="canvas"></canvas>
                    <img id="previewImg" class="preview" alt="Preview">
                </div>
            </div>

            <!-- เวลาเลิกงาน -->
            <div class="form-group">
                <label for="endTime">เวลาเลิกงาน (ระบบ 24 ช.ม.)</label>
                <input type="time" id="endTime" step="60" required>
            </div>

            <!-- เลข Call สาขาสุดท้าย -->
            <div class="form-group">
                <label for="callNo">เลข Call สาขาสุดท้าย</label>
                <input type="text" id="callNo" placeholder="เช่น C20261012..." required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">บันทึกข้อมูล OT</button>
        </form>
        <div id="status"></div>
    </div>

    <!-- ประวัติการบันทึก -->
    <div class="history-card">
        <h3>📊 ประวัติการบันทึก OT</h3>
        <div id="historyList" class="history-list">
            <div style="text-align:center; color: var(--text-muted); padding: 15px; font-size:13px;">กำลังโหลดข้อมูล...</div>
        </div>
    </div>
</div>

<script>
    // ⚠️ Web App URL ของคุณ
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxj7ekHGoaYZfYbgYD9knH2a59buXmG3P-lVl7fF-rWk1-AhxgJ6alBava9mM8Sqcrv/exec';

    const workDateInput = document.getElementById('workDate');
    const fullNameInput = document.getElementById('fullName');
    const teamSelect = document.getElementById('team');
    const endTimeInput = document.getElementById('endTime');
    const callNoInput = document.getElementById('callNo');
    
    const startCamBtn = document.getElementById('startCamBtn');
    const uploadFile = document.getElementById('uploadFile');
    const video = document.getElementById('video');
    const captureBtn = document.getElementById('captureBtn');
    const canvas = document.getElementById('canvas');
    const previewImg = document.getElementById('previewImg');

    const form = document.getElementById('otForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    const historyList = document.getElementById('historyList');

    let finalImageBase64 = "";
    let mediaStream = null;

    // ตั้งค่าเริ่มต้นวันที่เป็นวันปัจจุบัน
    const todayStr = new Date().toISOString().split('T')[0];
    workDateInput.value = todayStr;

    // โหลดข้อมูลชื่อและทีมเดิมจาก LocalStorage (ถ้ามี)
    if (localStorage.getItem('ot_fullname')) fullNameInput.value = localStorage.getItem('ot_fullname');
    if (localStorage.getItem('ot_team')) teamSelect.value = localStorage.getItem('ot_team');

    // ฟังก์ชันช่วยจัดรูปแบบเวลาให้ออกมาเป็น HH:mm เสมอ
    function formatTimeDisplay(val) {
        if (!val) return '-';
        let str = String(val).trim();
        
        if (str.includes('T') && str.includes('Z')) {
            try {
                let d = new Date(str);
                let hours = String(d.getUTCHours()).padStart(2, '0');
                let mins = String(d.getUTCMinutes()).padStart(2, '0');
                return `${hours}:${mins}`;
            } catch (e) {}
        }

        if (str.length >= 5 && str.includes(':')) {
            return str.substring(0, 5);
        }
        
        if (str.length === 4) {
            return `${str.substring(0, 2)}:${str.substring(2, 4)}`;
        } else if (str.length === 3) {
            return `0${str.substring(0, 1)}:${str.substring(1, 3)}`;
        }
        
        return val;
    }

    // เปิดกล้องสด
    startCamBtn.addEventListener('click', async () => {
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
            video.srcObject = mediaStream;
            video.style.display = 'block';
            captureBtn.style.display = 'block';
            previewImg.style.display = 'none';
        } catch (err) {
            alert('ไม่สามารถเปิดกล้องได้ กรุณาใช้ปุ่มอัปโหลดรูปภาพแทน');
        }
    });

    // กดถ่ายภาพจากกล้องสด พร้อมประทับ Timestamp บนภาพ
    captureBtn.addEventListener('click', () => {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const now = new Date();
        const timeString = now.toLocaleDateString('th-TH', { dateStyle: 'medium' }) + ' ' + now.toLocaleTimeString('th-TH', { timeStyle: 'medium', hour12: false });
        
        context.fillStyle = "rgba(0, 0, 0, 0.6)";
        context.fillRect(10, canvas.height - 50, canvas.width - 20, 40);
        
        context.fillStyle = "#ffffff";
        context.font = "16px Prompt, sans-serif";
        context.fillText("📍 เวลา OT: " + timeString, 20, canvas.height - 25);

        finalImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
        previewImg.src = finalImageBase64;
        previewImg.style.display = 'block';

        mediaStream.getTracks().forEach(track => track.stop());
        video.style.display = 'none';
        captureBtn.style.display = 'none';
    });

    // อัปโหลดรูปภาพจากไฟล์เครื่อง
    uploadFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const now = new Date();
                    const timeString = now.toLocaleDateString('th-TH', { dateStyle: 'medium' }) + ' ' + now.toLocaleTimeString('th-TH', { timeStyle: 'medium', hour12: false });
                    
                    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                    ctx.fillRect(10, canvas.height - 50, canvas.width - 20, 40);
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "18px Prompt, sans-serif";
                    ctx.fillText("📍 เวลา OT: " + timeString, 20, canvas.height - 25);

                    finalImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    previewImg.src = finalImageBase64;
                    previewImg.style.display = 'block';
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    // ดึงประวัติ OT มาแสดงการ์ดประวัติย้อนหลัง (ดึงข้อมูล Col E จาก index 4 มาแสดงตรงเวลา)
    function loadHistory() {
        fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
            historyList.innerHTML = '';
            if (data.length > 1) {
                for (let i = data.length - 1; i >= 1; i--) {
                    let row = data[i];
                    
                    let workDateFormatted = row[1] ? new Date(row[1]).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }) : '-';
                    let formattedTime = formatTimeDisplay(row[4]); // Col E คือ index 4

                    let itemDiv = document.createElement('div');
                    itemDiv.className = 'history-item';
                    itemDiv.innerHTML = `
                        <div class="history-header">
                            <span class="history-date">📅 ${workDateFormatted}</span>
                            <span class="history-time">⏱️ ${formattedTime}</span>
                        </div>
                        <div class="history-body">
                            <span>👤 <b>${row[2] || '-'}</b></span>
                            <span style="color:var(--text-muted); font-size:12px;">${row[3] || '-'}</span>
                        </div>
                        <div class="history-footer">
                            <span>📞 Call: ${row[5] || '-'}</span>
                            ${row[6] ? `<a href="${row[6]}" target="_blank" class="history-link">🖼️ ดูรูปภาพ</a>` : ''}
                        </div>
                    `;
                    historyList.appendChild(itemDiv);
                }
            } else {
                historyList.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 15px; font-size:13px;">ยังไม่มีประวัติ OT</div>`;
            }
        })
        .catch(err => {
            console.error(err);
            historyList.innerHTML = `<div style="text-align:center; color: #b25353; padding: 15px; font-size:13px;">โหลดประวัติไม่สำเร็จ</div>`;
        });
    }

    loadHistory();

    // กดส่งฟอร์มบันทึกข้อมูล
    form.addEventListener('submit', (e) => {
        e.preventDefault();

        if (!finalImageBase64) {
            alert('กรุณาถ่ายรูปหรืออัปโหลดรูป Time Stamp หน้าสาขาก่อนบันทึก');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'กำลังบันทึกข้อมูล...';
        statusDiv.style.color = 'var(--text-muted)';
        statusDiv.innerText = 'กำลังส่งข้อมูลเข้า Google Sheet...';

        localStorage.setItem('ot_fullname', fullNameInput.value);
        localStorage.setItem('ot_team', teamSelect.value);

        const payload = {
            workDate: workDateInput.value,
            fullName: fullNameInput.value,
            team: teamSelect.value,
            endTime: endTimeInput.value,
            callNo: callNoInput.value,
            imageBase64: finalImageBase64
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusDiv.style.color = '#5a8a62';
            statusDiv.innerText = '✨ บันทึกเวลา OT สำเร็จเรียบร้อย!';
            form.reset();
            previewImg.style.display = 'none';
            finalImageBase64 = "";
            workDateInput.value = todayStr;
            
            if (localStorage.getItem('ot_fullname')) fullNameInput.value = localStorage.getItem('ot_fullname');
            if (localStorage.getItem('ot_team')) teamSelect.value = localStorage.getItem('ot_team');

            setTimeout(loadHistory, 2000);
        })
        .catch(err => {
            statusDiv.style.color = '#b25353';
            statusDiv.innerText = '❌ เกิดข้อผิดพลาดในการบันทึก';
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = 'บันทึกข้อมูล OT';
        });
    });
</script>

</body>
</html>
